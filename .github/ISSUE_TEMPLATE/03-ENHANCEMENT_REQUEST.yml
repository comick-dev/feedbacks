name: New Enhancement Request
description: File a request for updating an existing feature.
title: "[Enhancement]: "
labels: ["Enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement to Comick!

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate Check
      description: Please check existing issues before submitting this request.
      options:
        - label: I have searched existing issues and couldn't find a duplicate.
          required: true

  - type: dropdown
    id: device-type
    attributes:
      label: Current Viewing Device Type
      description: Which device are you using to view our website?
      options:
        - Computer (Browser)
        - Computer (PWA)
        - Android Phone (Browser)
        - Android Phone (PWA)
        - iPhone (Browser)
        - iPhone (PWA)
        - Tablet (Please mention which and what type in Additional Context)
        - Other Device (Please mention which and what type in Additional Context)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: existing-feature-update
    attributes:
      label: Which existing feature is to be updated?
      description: Select the feature that is being updated.
      options:
        - UI
        - Image
        - PWA
        - Account
        - Search
        - Notifications
        - Community Contributions
        - Custom Lists
        - Membership
        - Themes
        - System Bot
        - Automatic Chapter Scraping Sites
        - Admin Area (Only for trusted)
      default: 0
    validations:
      required: true

  - type: textarea
    id: update-why
    attributes:
      label: What new update is needed for the selected feature and WHY?
      description: Describe the update needed for the selected feature and why it should be added.
      placeholder: Describe the update and why it should be added.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Upload media (Screenshots / Videos)
      description: Please add screenshots or videos to help us understand the request. You can also add media in the description above.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information needed to be given?
      placeholder: "Add relevant information, if any"
    validations:
      required: false

  - type: input
    id: discord
    attributes:
      label: Discord username
      description: Optional — add your Discord username if you're comfortable being contacted about this issue.
      placeholder: "@username"
    validations:
      required: false
