name: New Feature Request
description: File a request for a new feature.
title: "[New Feature]: "
labels: ["New Feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to request a new feature!

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate Check
      description: Please check existing issues before submitting this request.
      options:
        - label: I have searched existing issues and couldn't find a duplicate.
          required: true

  - type: textarea
    id: what-is-needed
    attributes:
      label: What new feature is needed and WHY?
      description: Describe what the new feature would do and why it should be added.
      placeholder: Describe the new feature and why it should be added.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Upload media (Screenshots / Videos)
      description: Please add screenshots or videos to help us understand the request. You can also add media in the description above.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information needed to be given?
      placeholder: "Add relevant information, if any"
    validations:
      required: false

  - type: input
    id: discord
    attributes:
      label: Discord username
      description: Optional — add your Discord username if you're comfortable being contacted about this issue.
      placeholder: "@username"
    validations:
      required: false
